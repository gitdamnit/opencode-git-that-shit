name: Publish to npm

# Publication is deliberately manual. Creating or publishing a GitHub release
# must never publish to npm automatically, so this workflow only runs when a
# maintainer dispatches it by hand for an authorised release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag being published (informational only)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public
